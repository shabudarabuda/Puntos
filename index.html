<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Puntos</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #000; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var TAU = Math.PI * 2;

  var W = 1200;            // размер зацикленной «коробки» вокруг камеры
  var N = 2600;            // количество кругов
  var F = 3;               // на сколько осколков лопается круг (если лопается)
  var NEAR = 8;
  var NEAR_FADE = 60;      // ближе этого круги плавно исчезают
  var FOCUS = 320;         // расстояние до плоскости фокуса
  var ZMAX = 820;          // глубина, на которой круг полностью растворяется в темноте
  var width = 0, height = 0, dpr = 1, focal = 600;

  // ---------- палитры (плоские цвета) ----------
  // c: [r, g, b, вес]; deep — цвет «дали», в которую уходят круги
  // стартовая палитра («самоцветы»); все следующие рождаются генератором и не повторяются
  var START_PALETTE = { base: 250, deep: [8, 10, 26], c: [
      [239, 232, 218, 3.0], [221, 184, 116, 2.0], [47, 82, 255, 3.0], [138, 99, 255, 2.0],
      [226, 79, 212, 1.4], [255, 90, 122, 1.4], [47, 224, 200, 2.0], [189, 242, 62, 0.6] ] };
  var Cn = 8;
  var Dn = 40;              // слоёв глубины (цвет и порядок рисования)
  var S2 = 2 * Cn;          // ключ слоя: текущая палитра + следующая палитра
  var K2 = Dn * S2;
  var curPal = START_PALETTE;

  function sstep(a, b, x) {
    var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  // расфокус минимальный: чуть крупнее и чуть прозрачнее
  var levelAlpha = new Float32Array(Dn);
  var levelRad = new Float32Array(Dn);
  var colorStr = new Array(K2);
  var lvl, c;
  for (lvl = 0; lvl < Dn; lvl++) {
    var uu = (lvl + 0.5) / Dn;
    var zcc = ZMAX * Math.pow(uu, 1 / 0.75);
    var coc = Math.abs(FOCUS / zcc - 1) - 0.1;
    coc = coc <= 0 ? 0 : Math.min(1, coc * 1.2);
    levelRad[lvl] = 1 + 0.16 * coc;
    levelAlpha[lvl] = 1 - 0.2 * coc;
  }

  // цвета слоёв глубины для палитры pi; half: 0 — текущая, 1 — следующая
  function fillColors(pal, half) {
    for (var l = 0; l < Dn; l++) {
      var u = (l + 0.5) / Dn;
      var mix = 0.85 * Math.pow(u, 1.2);
      var dim = 1 - sstep(0.5, 1.0, u);
      for (var cc = 0; cc < Cn; cc++) {
        var p = pal.c[cc], d = pal.deep;
        var r = Math.round((p[0] * (1 - mix) + d[0] * mix) * dim);
        var g = Math.round((p[1] * (1 - mix) + d[1] * mix) * dim);
        var b = Math.round((p[2] * (1 - mix) + d[2] * mix) * dim);
        colorStr[l * S2 + half * Cn + cc] = 'rgb(' + r + ',' + g + ',' + b + ')';
      }
    }
  }
  fillColors(START_PALETTE, 0);
  fillColors(START_PALETTE, 1);

  // порядок рисования: от дальних слоёв к ближним
  var drawOrder = [];
  for (lvl = Dn - 1; lvl >= 0; lvl--) for (var jj = 0; jj < S2; jj++) drawOrder.push(lvl * S2 + jj);

  function pickColor(pal) {
    var cs = pal.c, tw = 0, j;
    for (j = 0; j < Cn; j++) tw += cs[j][3];
    var x = Math.random() * tw;
    for (j = 0; j < Cn; j++) { x -= cs[j][3]; if (x <= 0) return j; }
    return Cn - 1;
  }

  // ---------- круги ----------
  var px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
  var pr = new Float32Array(N), pc = new Uint8Array(N), pcNew = new Uint8Array(N);
  var ph = new Float32Array(N);        // фаза дрожи
  var dT = new Float32Array(N);        // расстояние до зажатого круга
  var cdx = new Float32Array(N), cdy = new Float32Array(N), cdz = new Float32Array(N); // вектор от центра взрыва
  var phc = new Float32Array(N), phs = new Float32Array(N);
  // новый мир: итоговые позиции, размеры, времена вылета из центра
  var npx = new Float32Array(N), npy = new Float32Array(N), npz = new Float32Array(N), npr = new Float32Array(N);
  var dXa = new Float32Array(N), dYa = new Float32Array(N), dZa = new Float32Array(N);
  var launchA = new Float32Array(N), durA = new Float32Array(N);
  var Cx = 0, Cy = 0, Cz = 0;          // центр рождения новой вселенной в мире
  var bxA = new Float32Array(N), byA = new Float32Array(N), bzA = new Float32Array(N);
  var sXa = new Float32Array(N), sYa = new Float32Array(N), sZa = new Float32Array(N);   // откуда стартует каждая новая точка
  var strokeX = [], strokeY = [];      // росчерк пальца во время зажатия
  var shapeCur = null, shapeNew = null; // форма частиц текущего и нового мира (null — круги)
  var dRotCur = new Float32Array(N), dRotNew = new Float32Array(N);
  var oldVis = new Uint8Array(N);      // был ли круг в кадре в момент взрыва
  var shatterA = new Uint8Array(N);    // лопается ли на осколки или улетает целиком
  var newFly = new Uint8Array(N);      // летит ли новая точка из центра или проявляется на месте
  // осколки: направление, дальность разлёта, доля размера
  var fdx = new Float32Array(N * F), fdy = new Float32Array(N * F), fdz = new Float32Array(N * F);
  var fR = new Float32Array(N * F), fS = new Float32Array(N * F);

  function randomizeFragments() {
    for (var id = 0; id < N * F; id++) {
      var z = Math.random() * 2 - 1, a = Math.random() * TAU, s = Math.sqrt(1 - z * z);
      fdx[id] = s * Math.cos(a); fdy[id] = s * Math.sin(a); fdz[id] = z;
      fR[id] = 300 + 1100 * Math.pow(Math.random(), 0.8);
      fS[id] = 0.35 + 0.45 * Math.random();
    }
  }
  randomizeFragments();

  var i;
  for (i = 0; i < N; i++) {
    px[i] = Math.random() * W;
    py[i] = Math.random() * W;
    pz[i] = Math.random() * W;
    pr[i] = 1.5 + Math.pow(Math.random(), 2.2) * 6;
    pc[i] = pickColor(START_PALETTE);
    ph[i] = Math.random() * TAU;
    phc[i] = Math.cos(ph[i]); phs[i] = Math.sin(ph[i]);
  }

  // буферы кадра (частицы = круги и осколки)
  var M = N * (F + 1) + 64;
  var rotA = new Float32Array(M);
  var sxA = new Float32Array(M), syA = new Float32Array(M), srA = new Float32Array(M);
  var zA = new Float32Array(M);
  var keyA = new Int32Array(M), parA = new Int32Array(M);
  var cnt = new Int32Array(K2), startA = new Int32Array(K2), posA = new Int32Array(K2);
  var order = new Int32Array(M);
  var nearIdx = new Int32Array(M);
  var np = 0, nearN = 0;

  // ---------- камера ----------
  var cam = { x: 0, y: 0, z: 0 };
  var R = [1, 0, 0], D = [0, 1, 0], Fw = [0, 0, 1];  // вправо, вниз, вперёд

  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function norm(a) {
    var n = Math.hypot(a[0], a[1], a[2]) || 1;
    a[0] /= n; a[1] /= n; a[2] /= n;
  }
  function orthonormalize() {
    norm(Fw);
    var d = dot(R, Fw);
    R[0] -= Fw[0] * d; R[1] -= Fw[1] * d; R[2] -= Fw[2] * d;
    norm(R);
    D[0] = Fw[1] * R[2] - Fw[2] * R[1];
    D[1] = Fw[2] * R[0] - Fw[0] * R[2];
    D[2] = Fw[0] * R[1] - Fw[1] * R[0];
  }
  function rot(A, B, a) {
    var cs = Math.cos(a), sn = Math.sin(a);
    for (var k = 0; k < 3; k++) {
      var av = A[k], bv = B[k];
      A[k] = av * cs + bv * sn;
      B[k] = bv * cs - av * sn;
    }
  }

  // ---------- плавное движение ----------
  // 0 вправо, 1 вниз, 2 вперёд, 3 рыскание, 4 тангаж, 5 крен
  var rem = [0, 0, 0, 0, 0, 0];
  var vel = [0, 0, 0, 0, 0, 0];
  var fv  = [0, 0, 0, 0, 0, 0];
  var ST_HOLD = 0.22, ST_FREE = 1.0;
  var DRIFT = 1.5;         // ед./с — фоновый дрейф камеры по оси X
  var st = ST_FREE;

  function smoothStep(i, dt) {
    var omega = 2 / st;
    var x = omega * dt;
    var e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    var target = rem[i];
    var change = -target;
    var temp = (vel[i] + omega * change) * dt;
    vel[i] = (vel[i] - omega * temp) * e;
    var out = target + (change + temp) * e;
    if ((target > 0) === (out > target)) { out = target; vel[i] = 0; }
    rem[i] -= out;
    return out;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    focal = Math.max(width, height) * 0.8;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- ввод ----------
  var XY_K = 0.6;
  var Z_K = 2.6;
  var FLING = 0.4;
  var TAP_SLOP = 10;
  var TAP_TIME = 280;
  var TAPK = 0.45;
  var TAP_NUDGE = 26;
  var MOVE_T = 20;
  var MAXT = 9000;
  var TAP_TURN = 0.6;
  var COMBO_WINDOW = 700;
  var lastTapT = 0, combo = 0;

  var HOLD_MS = 300;       // сколько держать палец, чтобы круг «зацепился»
  var CHARGE_T = 2.6;      // сек. нарастания до взрыва
  var HIT_PX = 28;         // допуск попадания пальцем по кругу

  var pointers = new Map();
  var base = null;
  var g = { sx: 0, sy: 0, t: 0, moved: false, multi: false, held: false, cm: false };
  var lastMove = 0;

  function stats() {
    var arr = Array.from(pointers.values());
    var cx = 0, cy = 0, n = arr.length;
    arr.forEach(function (p) { cx += p.x; cy += p.y; });
    cx /= n; cy /= n;
    var d = 0, ang = 0;
    if (n >= 2) {
      d = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y);
      ang = Math.atan2(arr[1].y - arr[0].y, arr[1].x - arr[0].x);
    }
    return { n: n, cx: cx, cy: cy, d: d, ang: ang };
  }

  function fling() {
    var now = performance.now();
    if (now - lastMove < 90) {
      for (var k = 0; k < 6; k++) rem[k] += fv[k] * FLING;
    }
    for (var j = 0; j < 6; j++) fv[j] = 0;
  }

  function clampAbs(v, lim) { return v > lim ? lim : (v < -lim ? -lim : v); }

  function doTap(x, y) {
    var now = performance.now();
    var gap = now - lastTapT;
    lastTapT = now;
    var fast = 0;
    if (gap < COMBO_WINDOW) { combo = Math.min(combo + 1, 20); fast = 1 - gap / COMBO_WINDOW; }
    else combo = 0;

    var ox = (x - width / 2) / focal, oy = (y - height / 2) / focal;
    rem[3] = clampAbs(rem[3] + Math.atan(ox) * TAP_TURN, 1.4);
    rem[4] = clampAbs(rem[4] + Math.atan(oy) * TAP_TURN, 1.4);

    var m0 = vel[0] + rem[0] / st, m1 = vel[1] + rem[1] / st, m2 = vel[2] + rem[2] / st;
    var ts = Math.hypot(m0, m1, m2);
    if (ts < MOVE_T) {
      rem[2] += TAP_NUDGE;
      return;
    }
    var ramp = Math.min(combo / 12, 1);
    var gain = Math.min(1.4, 0.1 + 0.35 * fast + 0.9 * ramp * ramp);
    var kt = Math.max(0, Math.min(gain, MAXT / ts - 1));
    rem[0] += m0 * kt * ST_FREE;
    rem[1] += m1 * kt * ST_FREE;
    rem[2] += m2 * kt * ST_FREE + TAP_NUDGE * 0.25 * (1 + fast);
  }

  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    var now = performance.now();
    if (pointers.size === 0) {
      g = { sx: e.clientX, sy: e.clientY, t: now, moved: false, multi: false, held: false, cm: false };
    } else {
      fling();
      g.multi = true; g.moved = true;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    base = stats();
    lastMove = now;
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var s = stats();
    var now = performance.now();
    e.preventDefault();

    if (g.cm && s.n === 1) { wobbleMove(e.clientX, e.clientY); return; }

    if (s.n === 1 && !g.moved) {
      if (Math.hypot(e.clientX - g.sx, e.clientY - g.sy) < TAP_SLOP) return;
      g.moved = true; base = s; lastMove = now;
      return;
    }
    if (s.n >= 2) { g.multi = true; g.moved = true; }

    var dt = Math.max((now - lastMove) / 1000, 0.008);
    lastMove = now;

    var del = [0, 0, 0, 0, 0, 0];
    var dx = s.cx - base.cx, dy = s.cy - base.cy;
    if (s.n === 1) {
      del[3] = -dx / focal;
      del[4] = -dy / focal;
    } else {
      del[0] = -dx * XY_K;
      del[1] = -dy * XY_K;
      del[2] = (s.d - base.d) * Z_K;
      var da = s.ang - base.ang;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      del[5] = -da;
    }
    for (var k = 0; k < 6; k++) {
      rem[k] += del[k];
      fv[k] += (del[k] / dt - fv[k]) * 0.35;
    }
    base = s;
  });

  function release(e, cancelled) {
    if (!pointers.has(e.pointerId)) return;
    var now = performance.now();
    if (!cancelled && pointers.size === 1 && !g.moved && !g.multi && !g.held && now - g.t < TAP_TIME) {
      doTap(e.clientX, e.clientY);
    } else {
      fling();
    }
    pointers.delete(e.pointerId);
    if (pointers.size) base = stats();
  }
  canvas.addEventListener('pointerup', function (e) { release(e, false); });
  canvas.addEventListener('pointercancel', function (e) { release(e, true); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    rem[2] += -e.deltaY * 1.0;
  }, { passive: false });

  // ---------- зажатие круга: дрожь → взрыв → новая палитра ----------
  var tgt = -1;            // зажатый круг
  var charging = false;
  var charge = 0;          // 0..1
  var burst = null;        // { tb, np, maxD }
  var delayA = new Float32Array(N);
  var shake = 0;           // дрожь самой камеры
  var relMul = 1;          // затухание качаний после отпускания пальца
  // палец, который двигается во время зажатия: усиливает раскачку и таскает эпицентр
  var fingerX = 0, fingerY = 0, fxS = 0, fyS = 0;      // палец и его сглаженная точка
  var wobE = 0;                                        // энергия шатания пальцем (затухает)
  var wobTotal = 0, wobDX = 0, wobDY = 0, wobCross = 0, lastDX = 0, lastDY = 0;
  var zdE = 320;                                       // глубина эпицентра
  var epX = 0, epY = 0, epZ = 0;                       // эпицентр в мире

  function wobbleMove(x, y) {
    var dx = x - fingerX, dy = y - fingerY, dist = Math.hypot(dx, dy);
    if (dist < 0.5) return;
    fingerX = x; fingerY = y;
    if (strokeX.length < 2500) {
      var lx = strokeX[strokeX.length - 1], ly = strokeY[strokeY.length - 1];
      if (Math.hypot(x - lx, y - ly) >= 2.5) { strokeX.push(x); strokeY.push(y); }
    }
    wobE = Math.min(1.6, wobE + dist / 260);
    wobTotal += dist; wobDX += dx; wobDY += dy;
    var nx = dx / dist, ny = dy / dist;
    wobCross += lastDX * ny - lastDY * nx;     // знак: по часовой или против
    lastDX = nx; lastDY = ny;
  }
  // раскачка: серия качаний, каждое сильнее предыдущего в 1.86 раза; последнее — самое мощное
  var NSW = 6, SW_RATIO = 1.86, AMAX = 6.0;
  var SWA = [];
  for (var si = 0; si < NSW; si++) SWA.push(AMAX / Math.pow(SW_RATIO, NSW - 1 - si));
  var swA = 0, swP = 0, swNorm = 0;   // амплитуда, фаза маятника (-1..1), доля от максимума

  function swingAt(ch) {
    var c = ch < 0 ? 0 : (ch > 1 ? 1 : ch);
    var pos = c * NSW, i = Math.min(NSW - 1, Math.floor(pos)), u = pos - i;
    var A = SWA[i], last = i === NSW - 1;
    // огибающая: внутри каждого качания разгон и спад; в последнем — только разгон до пика
    var env = last ? 0.35 + 0.65 * Math.sin(Math.PI * 0.5 * u) : 0.35 + 0.65 * Math.sin(Math.PI * u);
    swA = A * env * relMul * (1 + 0.7 * Math.min(wobE, 1.4));
    swP = (last && u >= 1 ? 0 : Math.sin(TAU * u)) * relMul;   // маятник: туда-обратно
    swNorm = swA / AMAX;
  }

  var WAVE_V = 2400;       // скорость ударной волны от центра, ед./с
  var T_FLY = 1.3;         // сколько живут разлетающиеся осколки старого мира

  function pickDot(x, y) {
    var best = -1, bd = 1e9, p;
    for (p = 0; p < np; p++) {
      var d = Math.hypot(sxA[p] - x, syA[p] - y) - srA[p];
      if (d < bd) { bd = d; best = parA[p]; }
    }
    if (best >= 0) return best;
    // в кадре нет ни одного круга — берём ближайший к камере
    var bz = 1e9;
    for (var k = 0; k < N; k++) {
      var dx = wrapD(px[k] - cam.x), dy = wrapD(py[k] - cam.y), dz = wrapD(pz[k] - cam.z);
      var dd = dx * dx + dy * dy + dz * dz;
      if (dd < bz) { bz = dd; best = k; }
    }
    return best;
  }

  function wrapD(v) { return v - W * Math.floor(v / W + 0.5); }

  // эпицентр — точка под (сглаженным) пальцем; расстояния до него задают волны дрожи и взрыва
  function updateEpicenter() {
    var ox = (fxS - width / 2) / focal * zdE, oy = (fyS - height / 2) / focal * zdE;
    epX = cam.x + R[0] * ox + D[0] * oy + Fw[0] * zdE;
    epY = cam.y + R[1] * ox + D[1] * oy + Fw[1] * zdE;
    epZ = cam.z + R[2] * ox + D[2] * oy + Fw[2] * zdE;
    for (var j = 0; j < N; j++) {
      var dx = wrapD(px[j] - epX), dy = wrapD(py[j] - epY), dz = wrapD(pz[j] - epZ);
      cdx[j] = dx; cdy[j] = dy; cdz[j] = dz;
      dT[j] = Math.sqrt(dx * dx + dy * dy + dz * dz);
    }
  }

  function beginCharge(k) {
    tgt = k; charging = true; charge = 0; relMul = 1;
    var tx = wrapD(px[k] - cam.x), ty = wrapD(py[k] - cam.y), tz = wrapD(pz[k] - cam.z);
    var zd = tx * Fw[0] + ty * Fw[1] + tz * Fw[2];
    zdE = (zd < 120 || zd > 600) ? 320 : zd;
    fingerX = fxS = g.sx; fingerY = fyS = g.sy;
    wobE = 0; wobTotal = 0; wobDX = 0; wobDY = 0; wobCross = 0; lastDX = 0; lastDY = 0;
    strokeX = [g.sx]; strokeY = [g.sy];
    updateEpicenter();
  }

  function startBurst(T) {
    // как двигался палец — немного влияет на рождение: цвет, закрутку, темп
    var enW = Math.min(1, wobTotal / 3000);
    var hint = wobTotal > 150 ? Math.atan2(wobDY, wobDX) * 180 / Math.PI + 180 + rnd(-35, 35) : undefined;
    var nextPal = genPalette(hint);
    fillColors(nextPal, 1);
    randomizeFragments();
    law = genLaw(T);
    // нарисовал фигуру — мир из таких фигур; иначе круги
    var spec = recognizeStroke(strokeX, strokeY);

            // упругая среда: радиальные волны то сжимают, то растягивают расстояния между точками;
            // чем сильнее шатаешь пальцем, тем больше хаос
            var em = wobE < 1.4 ? wobE : 1.4;
            var elInv = 1 / (dk + 40);
            var el = swNorm * (8 + 24 * em) * w *
                     (Math.sin(0.026 * dk - 8.5 * T) + 0.6 * em * Math.sin(0.071 * dk - 13.3 * T + ph[k]));
            rx += cdx[k] * elInv * el; ry += cdy[k] * elInv * el; rz += cdz[k] * elInv * el;
          }
          scl = 1 + 0.5 * swNorm * gwt * (0.5 + 0.5 * Math.sin(T * 16));
          if (amp > 0) {
            var a1 = T * fq + ph[k];
            rx += Math.sin(a1) * amp;
            ry += Math.sin(a1 * 1.31 + ph[k] * 2.1) * amp;
            rz += Math.cos(a1 * 0.87 + ph[k] * 1.7) * amp * 0.6;
          }
        }
        addParticle(rx, ry, rz, pr[k] * scl, pc[k], 0, k, dRotCur[k]);
      }

      // новая вселенная: то, что окажется на экране, вылетает из центра; остальное проявляется на месте
      if (burst !== null) {
        var tau2 = s - launchA[k];
        if (tau2 >= 0) {
          if (!newFly[k]) {
            var gp = clamp01(tau2 / durA[k]);
            var gq = gp >= 1 ? 1 : EASES[law.ease](gp);   // иногда с лёгким «выпрыгиванием»
            if (gq < 0.03) continue;
            var qx = npx[k] - camX; qx -= W * Math.floor(qx / W + 0.5);
            var qy = npy[k] - camY; qy -= W * Math.floor(qy / W + 0.5);
            var qz = npz[k] - camZ; qz -= W * Math.floor(qz / W + 0.5);
            addParticle(qx, qy, qz, npr[k] * gq, pcNew[k], 1, k, dRotNew[k]);
          } else {
            var pp = tau2 >= durA[k] ? 1 : tau2 / durA[k];
            var en = pp >= 1 ? 1 : EASES[law.ease](pp);
            var vx = dXa[k] * en, vy = dYa[k] * en, vz = dZa[k] * en;
            if (pp < 1) {
              var ax = law.ax, ay = law.ay, az = law.az;
              if (law.swirl !== 0) {
                var phi = law.swirl * (1 - pp), cph = Math.cos(phi), sph = Math.sin(phi);
                var adv = ax * vx + ay * vy + az * vz;
                var cxv = ay * vz - az * vy, cyv = az * vx - ax * vz, czv = ax * vy - ay * vx;
                var nvx = vx * cph + cxv * sph + ax * adv * (1 - cph);
                var nvy = vy * cph + cyv * sph + ay * adv * (1 - cph);
                var nvz = vz * cph + czv * sph + az * adv * (1 - cph);
                vx = nvx; vy = nvy; vz = nvz;
              }
              if (law.bend !== 0) {
                var bw = Math.sin(Math.PI * pp) * law.bend;
                vx += (ay * dZa[k] - az * dYa[k]) * bw;
                vy += (az * dXa[k] - ax * dZa[k]) * bw;
                vz += (ax * dYa[k] - ay * dXa[k]) * bw;
              }
              if (law.cloud > 0) {
                var cw = (1 - en) * (1 - en) * law.cloud;
                vx += bxA[k] * cw; vy += byA[k] * cw; vz += bzA[k] * cw;
              }
            }
            var wx = sXa[k] + vx - camX; wx -= W * Math.floor(wx / W + 0.5);
            var wy = sYa[k] + vy - camY; wy -= W * Math.floor(wy / W + 0.5);
            var wz = sZa[k] + vz - camZ; wz -= W * Math.floor(wz / W + 0.5);
            var grow = en < 0 ? 0 : (en > 1 ? 1 : en);
            addParticle(wx, wy, wz, npr[k] * (0.12 + 0.88 * grow), pcNew[k], 1, k, dRotNew[k] + (1 - pp) * law.spinIn);
          }
        }
      }
    }

    // порядок: от дальних к ближним, пачками по цвету и глубине
    var run = 0, j, p;
    for (j = 0; j < drawOrder.length; j++) {
      var kk = drawOrder[j];
      startA[kk] = run; posA[kk] = run; run += cnt[kk];
    }
    for (p = 0; p < np; p++) {
      if (zA[p] >= NEAR_FADE) order[posA[keyA[p]]++] = p;
    }

    // ---------- рисуем ----------
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (j = 0; j < drawOrder.length; j++) {
      var kd = drawOrder[j];
      var cn = cnt[kd];
      if (!cn) continue;
      ctx.fillStyle = colorStr[kd];
      ctx.globalAlpha = levelAlpha[(kd / S2) | 0];
      ctx.beginPath();
      var s0 = startA[kd], s1 = s0 + cn;
      var shp = (kd % S2) >= Cn ? shapeNew : shapeCur;
      for (var qq = s0; qq < s1; qq++) {
        var id2 = order[qq], rr = srA[id2], xx = sxA[id2], yy = syA[id2];
        if (shp === null) { ctx.moveTo(xx + rr, yy); ctx.arc(xx, yy, rr, 0, TAU); }
        else tracePoly(shp, xx, yy, rr, rotA[id2]);
      }
      ctx.fill();
    }

    // самые близкие круги — по одному, с плавным исчезновением
    for (j = 0; j < nearN; j++) {
      var id3 = nearIdx[j], kn = keyA[id3];
      ctx.fillStyle = colorStr[kn];
      ctx.globalAlpha = levelAlpha[(kn / S2) | 0] * (zA[id3] - NEAR) / (NEAR_FADE - NEAR);
      ctx.beginPath();
      var shn = (kn % S2) >= Cn ? shapeNew : shapeCur;
      if (shn === null) ctx.arc(sxA[id3], syA[id3], srA[id3], 0, TAU);
      else tracePoly(shn, sxA[id3], syA[id3], srA[id3], rotA[id3]);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
